name: Build & Push - Fork image to GHCR
# Builds an amd64 image of this fork on every push to main and pushes it to
# ghcr.io/<owner>/calibre-web-automated. Never runs in the upstream repository.

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository != 'crocodilestick/Calibre-Web-Automated'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/calibre-web-automated" >> "$GITHUB_ENV"
          # Forks often come without upstream tags; fall back to a plain dev version
          BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          echo "VERSION=${BASE_VERSION}-fork.${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ env.VERSION }}
